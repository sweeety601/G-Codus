name: Apply G-Codus UI and notification patch

on:
  push:
    paths:
      - "scripts/apply_notification_ui.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply patch
        run: python scripts/apply_notification_ui.py
      - name: Commit generated changes
        run: |
          git config user.name "G-Codus Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/gcodus/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Organize game sections and schedule notifications"
          git push
