name: Verify Android build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message != 'CI verify result'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build APK
        run: |
          set +e
          ./gradlew clean assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/build_rc
          exit $rc
      - name: Record build result
        if: always()
        run: |
          rc=$(cat /tmp/build_rc 2>/dev/null || echo 1)
          mkdir -p .ci
          if [ "$rc" -eq 0 ]; then status=PASS; else status=FAIL; fi
          printf '%s\ncommit=%s\nrun=%s\n' "$status" "$GITHUB_SHA" "$GITHUB_RUN_ID" > .ci/build-status.txt
          tail -n 240 /tmp/build.log 2>/dev/null > .ci/build-log.txt || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/build-status.txt .ci/build-log.txt
          git commit -m 'CI verify result' || true
          git push || true
