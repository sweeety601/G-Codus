name: Verify Android build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message != 'CI verify result'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build APK
        id: build
        run: |
          set +e
          ./gradlew clean assembleDebug --stacktrace
          rc=$?
          echo "$rc" > /tmp/build_rc
          exit $rc
      - name: Record build result
        if: always()
        run: |
          rc=$(cat /tmp/build_rc 2>/dev/null || echo 1)
          mkdir -p .ci
          if [ "$rc" -eq 0 ]; then
            printf 'PASS\ncommit=%s\n' "$GITHUB_SHA" > .ci/build-status.txt
          else
            printf 'FAIL\ncommit=%s\n' "$GITHUB_SHA" > .ci/build-status.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/build-status.txt
          git commit -m 'CI verify result' || true
          git push || true
