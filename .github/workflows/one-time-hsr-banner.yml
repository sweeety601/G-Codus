name: One-time HSR banner update

on:
  push:
    paths:
      - ".github/workflows/one-time-hsr-banner.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install openpyxl
      - name: Update HSR 4.6 confirmed banner
        run: |
          python - <<'PY'
          from openpyxl import load_workbook

          chars = load_workbook("library/seed/03_Honkai_Star_Rail.xlsx", data_only=True)
          pearl_id = None
          for ws in chars.worksheets:
              for row in ws.iter_rows(values_only=True):
                  vals = [str(x or "").strip() for x in row]
                  if "Pearl" in vals:
                      ids = [x for x in vals if x.startswith("3.")]
                      if not ids:
                          raise SystemExit("Pearl found but no HSR ID")
                      pearl_id = ids[0]
                      print("Pearl ID:", pearl_id)
                      break
              if pearl_id:
                  break
          if not pearl_id:
              raise SystemExit("Pearl not found")

          path = "banners/03_Honkai_Star_Rail_confirmed.xlsx"
          wb = load_workbook(path)
          ws = wb["Banners"]
          headers = [c.value for c in ws[1]]
          expected = ["Версия и фаза", "Дата начала", "Дата окончания", "Персонажи в составе баннера", "4* в баннере"]
          if headers[:5] != expected:
              raise SystemExit(f"Unexpected banner schema: {headers}")

          values = ["4.6 Phase 1", "2026-09-28", "2026-10-21", f"{pearl_id},3.26", "3.84,3.61,3.54"]
          target = None
          for row in ws.iter_rows(min_row=2):
              phase = str(row[0].value or "").strip().lower()
              if phase in ("4.6 phase 1", "4.6 фаза 1"):
                  target = row
                  break

          if target:
              for cell, value in zip(target[:5], values):
                  cell.value = value
          else:
              ws.append(values)

          print("WRITTEN:", values)
          wb.save(path)
          PY
      - name: Commit change
        run: |
          git config user.name "g-codus-bot"
          git config user.email "g-codus-bot@users.noreply.github.com"
          git add banners/03_Honkai_Star_Rail_confirmed.xlsx
          git commit -m "Add HSR 4.6 confirmed banner" || exit 0
          git push
