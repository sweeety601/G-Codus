name: Apply current portrait fixes

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/apply_current_portrait_fixes.py"
      - "app/src/main/java/com/example/gcodus/MainActivity.kt"
      - "scripts/sync_game_icons.py"
      - "Honkai_Star_Rail_logo.png"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fixes
        run: python3 scripts/apply_current_portrait_fixes.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/gcodus/MainActivity.kt scripts/sync_game_icons.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No code changes."
          else
            git commit -m "Fix HSR portrait matching and enlarge top game tiles"
            git push
          fi
