name: Fix local banner images

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove remote portrait fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/gcodus/MainActivity.kt')
          s = p.read_text()
          old = '''        if (localId != 0) {\n            image.setImageResource(localId)\n            return\n        }\n\n        val url = "https://cdn.prydwen.gg/images/" +\n            when (gameId) {\n                "genshin" -> "genshin-impact"\n                "wuwa" -> "wuthering-waves"\n                "zzz" -> "zenless-zone-zero"\n                else -> gameId\n            } + "/characters/" + slug + "_full.webp"\n\n        executor.execute {\n            try {\n                val connection = java.net.URL(url).openConnection()\n                connection.connectTimeout = 12000\n                connection.readTimeout = 20000\n                connection.setRequestProperty("User-Agent", "G-Codus/1.0")\n                val bitmap = android.graphics.BitmapFactory.decodeStream(connection.getInputStream())\n                if (bitmap != null) runOnUiThread { image.setImageBitmap(bitmap) }\n            } catch (_: Exception) { }\n        }'''
          new = '''        if (localId != 0) {\n            image.setImageResource(localId)\n        } else {\n            // IMPORTANT: banner art must come only from portraits bundled in the APK.\n            // Never download a substitute image from the network.\n            image.setImageDrawable(null)\n        }'''
          if old not in s:
              raise SystemExit('Expected remote portrait fallback block was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/gcodus/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use only bundled banner portraits"
            git push
          fi
