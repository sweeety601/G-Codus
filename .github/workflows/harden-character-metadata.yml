name: Harden character metadata and tracking

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch character sources and canonical tracking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          db = Path('app/src/main/java/com/example/gcodus/CharacterDatabase.kt')
          s = db.read_text()
          old = '''        result += fetchGame("wuwa", WUWA_CHARACTERS)
        result += fetchGame("zzz", ZZZ_CHARACTERS)
        result += fetchGame("genshin", GENSHIN_CHARACTERS)
        result += fetchGame("starrail", HSR_CHARACTERS)
        result += fetchGame("endfield", ENDFIELD_CHARACTERS)

        // Static roster fallback compiled from the current public database lists.
        // This keeps the Wishlist usable even when a character-list page is down.
        result += fallbackCharacters("starrail", HSR_FALLBACK)
        result += fallbackCharacters("zzz", ZZZ_FALLBACK)
        result += fallbackCharacters("endfield", ENDFIELD_FALLBACK)'''
          new = '''        val sources = listOf(
            Triple("wuwa", WUWA_CHARACTERS, emptyList<String>()),
            Triple("zzz", ZZZ_CHARACTERS, ZZZ_FALLBACK),
            Triple("genshin", GENSHIN_CHARACTERS, emptyList<String>()),
            Triple("starrail", HSR_CHARACTERS, HSR_FALLBACK),
            Triple("endfield", ENDFIELD_CHARACTERS, ENDFIELD_FALLBACK)
        )
        for ((gameId, url, fallback) in sources) {
            val live = fetchGame(gameId, url)
            result += if (live.isNotEmpty()) live else fallbackCharacters(gameId, fallback)
        }'''
          if old in s: s = s.replace(old, new)
          s = s.replace('(?:wuthering-waves|zenless|genshin-impact)/characters/', '(?:wuthering-waves|zenless|genshin-impact|star-rail|arknights-endfield)/characters/')
          s = s.replace('"Pearl","Pela"', '"Pela"')
          s = s.replace('"Pogranichnik","Purrchena","Rossi","Si","Snowshine"', '"Pogranichnik","Purrchena","Rossi","Snowshine"')
          marker = '''        if (gameId == "zzz") {
            return "zzz|" + normalize(canonicalZzzName(name.ifBlank { slug }))
        }'''
          repl = '''        if (gameId == "zzz") return "zzz|" + canonicalIdentity(gameId, name.ifBlank { slug })
        if (gameId == "genshin") return "genshin|" + canonicalIdentity(gameId, slug.ifBlank { name })
        if (gameId == "wuwa") return "wuwa|" + canonicalIdentity(gameId, slug.ifBlank { name })
        if (gameId == "endfield") return "endfield|" + canonicalIdentity(gameId, slug.ifBlank { name })'''
          if marker in s: s = s.replace(marker, repl)
          if 'private fun canonicalIdentity(gameId: String' not in s:
              ins = '''    private fun portraitUrl(gameId: String, slug: String): String ='''
              fn = '''    private fun canonicalIdentity(gameId: String, value: String): String {
        val n = normalize(value)
        return when (gameId) {
            "genshin" -> when (n) {
                "kaedeharakazuha", "kazuha" -> "kazuha"
                "raidenshogun", "raiden" -> "raidenshogun"
                "tartaglia", "childe" -> "tartaglia"
                "wanderer", "scaramouche" -> "wanderer"
                "kamisatoayaka", "ayaka" -> "kamisatoayaka"
                "kamisatoayato", "ayato" -> "kamisatoayato"
                else -> n
            }
            "wuwa" -> when (n) {
                "theshorekeeper", "shorekeeper" -> "shorekeeper"
                "yangyangxuanling", "yangyang" -> "yangyang"
                else -> n
            }
            "zzz" -> when (n) {
                "billy", "billykid" -> "billykid"
                "anby", "anbydemara", "anbysoldier0", "soldier0anby" -> "anby"
                "grace", "gracehoward" -> "grace"
                "lucy", "lucyalt", "lucialt" -> "lucy"
                "yuzuha", "ukinamiyuzuha" -> "yuzuha"
                "nicole", "nicoledemara" -> "nicole"
                "orphieandmagus", "orhpieandmagus", "orhpiemagus" -> "orphieandmagus"
                else -> n
            }
            "starrail" -> when (n) {
                "blademortenax", "mortenaxblade" -> "mortenaxblade"
                "imbibitorlunae", "danhengimbibitorlunae" -> "imbibitorlunae"
                "topaz", "topazandnumby" -> "topaz"
                else -> n
            }
            "endfield" -> when (n) {
                "orhpieandmagus", "orhpiemagus", "orphieandmagus" -> "orphieandmagus"
                else -> n
            }
            else -> n
        }
    }

'''
              s = s.replace(ins, fn + ins)
          db.write_text(s)

          worker = Path('app/src/main/java/com/example/gcodus/NotificationSyncWorker.kt')
          w = worker.read_text()
          w = w.replace('.map { it.key.removePrefix(prefix) }', '.map { canonicalCharacterId(gameId, it.key.removePrefix(prefix)) }')
          start = w.find('    private fun sameCharacter(gameId: String, name: String, identity: String): Boolean {')
          end = w.find('\n    private fun normalizeIdentity', start)
          if start != -1 and end != -1:
              fn = '''    private fun sameCharacter(gameId: String, name: String, identity: String): Boolean {
        return canonicalCharacterId(gameId, name) == canonicalCharacterId(gameId, identity)
    }

    private fun canonicalCharacterId(gameId: String, value: String): String {
        val n = normalizeIdentity(value)
        return when (gameId) {
            "genshin" -> when (n) {
                "kaedeharakazuha", "kazuha" -> "kazuha"
                "raidenshogun", "raiden" -> "raidenshogun"
                "tartaglia", "childe" -> "tartaglia"
                "wanderer", "scaramouche" -> "wanderer"
                "kamisatoayaka", "ayaka" -> "kamisatoayaka"
                "kamisatoayato", "ayato" -> "kamisatoayato"
                else -> n
            }
            "wuwa" -> when (n) {
                "theshorekeeper", "shorekeeper" -> "shorekeeper"
                "yangyangxuanling", "yangyang" -> "yangyang"
                else -> n
            }
            "zzz" -> when (n) {
                "billy", "billykid" -> "billykid"
                "anby", "anbydemara", "anbysoldier0", "soldier0anby" -> "anby"
                "grace", "gracehoward" -> "grace"
                "lucy", "lucyalt", "lucialt" -> "lucy"
                "yuzuha", "ukinamiyuzuha" -> "yuzuha"
                "nicole", "nicoledemara" -> "nicole"
                "orphieandmagus", "orhpieandmagus", "orhpiemagus" -> "orphieandmagus"
                else -> n
            }
            "starrail" -> when (n) {
                "blademortenax", "mortenaxblade" -> "mortenaxblade"
                "imbibitorlunae", "danhengimbibitorlunae" -> "imbibitorlunae"
                "topaz", "topazandnumby" -> "topaz"
                else -> n
            }
            "endfield" -> when (n) {
                "orhpieandmagus", "orhpiemagus", "orphieandmagus" -> "orphieandmagus"
                else -> n
            }
            else -> n
        }
    }
'''
              w = w[:start] + fn + w[end:]
          worker.write_text(w)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/gcodus/CharacterDatabase.kt app/src/main/java/com/example/gcodus/NotificationSyncWorker.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Harden character metadata and canonical tracking"
          git push
