name: Fix countdown runtime
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'fix countdown runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch countdown executor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/gcodus/MainActivity.kt')
          s = p.read_text()
          old = 'private val executor = Executors.newSingleThreadScheduledExecutor()\n    private val imageExecutor = Executors.newFixedThreadPool(4)'
          new = 'private val executor = Executors.newSingleThreadScheduledExecutor()\n    private val countdownExecutor = Executors.newSingleThreadScheduledExecutor()\n    private val imageExecutor = Executors.newFixedThreadPool(4)'
          if old not in s:
              raise SystemExit('executor declaration not found')
          s = s.replace(old, new, 1)
          old = '        executor.scheduleAtFixedRate({\n            runOnUiThread {'
          new = '        countdownExecutor.scheduleAtFixedRate({\n            runOnUiThread {'
          if old not in s:
              raise SystemExit('countdown scheduler not found')
          s = s.replace(old, new, 1)
          old = '                        val target = OffsetDateTime.parse(pair.second).toInstant()'
          new = '''                        val target = try {\n                            OffsetDateTime.parse(pair.second).toInstant()\n                        } catch (_: Exception) {\n                            try { Instant.parse(pair.second) } catch (_: Exception) { null }\n                        } ?: return@forEach'''
          if old not in s:
              raise SystemExit('countdown parser not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/fix-countdown-runtime.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/gcodus/MainActivity.kt .github/workflows/fix-countdown-runtime.yml
          git commit -m 'fix countdown runtime'
          git push
