name: Sync game icons

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync_game_icons.py"
      - ".github/workflows/sync-game-icons.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and convert icons
        run: python3 scripts/sync_game_icons.py

      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/game_icons/source app/src/main/res/drawable-nodpi
          if git diff --cached --quiet; then
            echo "No icon changes."
          else
            git commit -m "Add game icons for home navigation"
            git push
          fi
