name: Fix latest portrait and UI issues

on:
  push:
    paths:
      - "scripts/fix_latest_issues.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply fixes
        run: python3 scripts/fix_latest_issues.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/gcodus/MainActivity.kt app/src/main/java/com/example/gcodus/CharacterDatabase.kt scripts/sync_game_icons.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to apply"
          else
            git commit -m "Fix HSR Endfield portraits and game header"
            git push
          fi
