name: One-time remove ZZZ 5.51

on:
  push:
    paths:
      - ".github/workflows/one-time-remove-zzz-551.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install openpyxl
      - name: Remove 5.51 from current ZZZ banner
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          path="banners/05_Zenless_Zone_Zero_confirmed.xlsx"
          wb=load_workbook(path)
          changed=False
          for ws in wb.worksheets:
              for row in ws.iter_rows():
                  vals=[str(c.value or "").strip() for c in row]
                  joined=" | ".join(vals).lower()
                  # Only touch the current 3.2 Phase 2 row.
                  if ("3.2" in joined and ("phase 2" in joined or "фаза 2" in joined)):
                      for c in row:
                          if c.value is not None:
                              parts=[p.strip() for p in str(c.value).replace(";",",").split(",")]
                              new=[p for p in parts if p != "5.51"]
                              if new != parts:
                                  c.value=", ".join(new)
                                  changed=True
                                  print("Changed:", ws.title, c.coordinate, c.value)
          if not changed:
              raise SystemExit("3.2 Phase 2 row with 5.51 was not found")
          wb.save(path)
          PY
      - name: Commit change
        run: |
          git config user.name "g-codus-bot"
          git config user.email "g-codus-bot@users.noreply.github.com"
          git add banners/05_Zenless_Zone_Zero_confirmed.xlsx
          git commit -m "Remove 5.51 from current ZZZ banner"
          git push
