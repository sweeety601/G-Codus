name: Fix promo cache fallback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix promo cache fallback in MainActivity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch MainActivity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/gcodus/MainActivity.kt')
          s = p.read_text()

          old = '''        val game = loadFeed().firstOrNull { it.id == gameId } ?: return\n        val root = findViewById<FrameLayout>(R.id.root)'''
          new = '''        val game = loadFeed().firstOrNull { it.id == gameId } ?: return\n        // Always reload the latest persisted/bundled promo feed when entering a game.\n        // This prevents an old empty SharedPreferences cache from hiding valid codes.\n        codesFeed = loadCachedCodes()\n        val root = findViewById<FrameLayout>(R.id.root)'''
          if old in s and 'Always reload the latest persisted/bundled promo feed' not in s:
              s = s.replace(old, new, 1)

          old = '''        fun showCodePage() {\n            content.removeAllViews()'''
          new = '''        fun showCodePage() {\n            // Re-read the feed before rendering the promo-code page so the page\n            // never depends on the value captured at application startup.\n            codesFeed = loadCachedCodes()\n            content.removeAllViews()'''
          if old in s and 'Re-read the feed before rendering the promo-code page' not in s:
              s = s.replace(old, new, 1)

          old = '''        if (!cached.isNullOrBlank()) {\n            try {\n                return parseCodesFeed(cached)\n            } catch (_: Exception) {\n                // Continue to the bundled feed.\n            }\n        }'''
          new = '''        if (!cached.isNullOrBlank()) {\n            try {\n                val parsed = parseCodesFeed(cached)\n                // An old empty cache must never hide a valid bundled feed.\n                if (parsed.active.isNotEmpty() || parsed.expired.isNotEmpty()) {\n                    return parsed\n                }\n            } catch (_: Exception) {\n                // Continue to the bundled feed.\n            }\n        }'''
          if old in s and 'An old empty cache must never hide a valid bundled feed.' not in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/gcodus/MainActivity.kt .github/workflows/fix-promo-cache.yml
          git commit -m "Fix promo cache fallback in MainActivity"
          git push