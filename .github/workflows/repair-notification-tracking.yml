name: Repair notification tracking

on:
  push:
    paths:
      - scripts/repair_notification_tracking.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch worker
        run: python3 scripts/repair_notification_tracking.py
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/gcodus/NotificationSyncWorker.kt
          git diff --cached --quiet || git commit -m 'Fix tracked character notifications'
          git push
