name: Temporary Android verification
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    if: github.event.head_commit.message != 'CI verify result'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Build
        run: gradle clean assembleDebug --stacktrace
