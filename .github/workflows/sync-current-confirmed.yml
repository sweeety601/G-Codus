name: Sync current confirmed banners

on:
  push:
    paths:
      - ".github/workflows/sync-current-confirmed.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update confirmed banner tables
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m pip install --quiet openpyxl
          python <<'PY'
          from openpyxl import load_workbook
          from pathlib import Path
          import re
          import unicodedata

          def norm(v):
              s = "" if v is None else str(v)
              s = unicodedata.normalize("NFKC", s).strip().lower()
              s = s.replace("ё", "е").replace("’", "'").replace("–", "-").replace("—", "-")
              s = re.sub(r"\\s+", " ", s)
              return s

          games = [
              {
                  "seed": "library/seed/01_Wuthering_Waves.xlsx",
                  "banner": "banners/01_Wuthering_Waves_confirmed.xlsx",
                  "phase": "3.7 Phase 1",
                  "start": "2026-09-30",
                  "end": "2026-10-22",
                  "five": ["Hsin", "Chisa", "Iuno"],
                  "four": ["Buling", "Taoqi", "Youhu"],
              },
              {
                  "seed": "library/seed/02_Genshin_Impact.xlsx",
                  "banner": "banners/02_Genshin_Impact_confirmed.xlsx",
                  "phase": "7.1 Phase 1",
                  "start": "2026-09-23",
                  "end": "2026-10-14",
                  "five": ["Vesna", "Vodyanitsa"],
                  "four": ["Faruzan", "Diona", "Chongyun"],
              },
              {
                  "seed": "library/seed/03_Honkai_Star_Rail.xlsx",
                  "banner": "banners/03_Honkai_Star_Rail_confirmed.xlsx",
                  "phase": "4.6 Phase 1",
                  "start": "2026-09-28",
                  "end": "2026-10-21",
                  "five": ["Pearl", "Evanescia"],
                  "four": ["Qingque", "Xueyi", "Misha"],
              },
              {
                  "seed": "library/seed/04_Arknights_Endfield.xlsx",
                  "banner": "banners/04_Arknights_Endfield_confirmed.xlsx",
                  "phase": "1.5 Phase 2",
                  "start": "2026-09-24",
                  "end": "2026-10-15",
                  "five": ["Yvonne"],
                  "four": [],
              },
              {
                  "seed": "library/seed/05_Zenless_Zone_Zero.xlsx",
                  "banner": "banners/05_Zenless_Zone_Zero_confirmed.xlsx",
                  "phase": "3.2 Phase 2",
                  "start": "2026-09-30",
                  "end": "2026-10-20",
                  "five": ["Roxy", "Promeia"],
                  "four": ["Corin", "Billy"],
              },
          ]

          def headers(ws):
              return {norm(c.value): i for i, c in enumerate(ws[1], start=1)}

          def find_col(h, aliases):
              for a in aliases:
                  if norm(a) in h:
                      return h[norm(a)]
              return None

          def split_names(value):
              if value is None:
                  return []
              return [x.strip() for x in re.split(r"[,;\\n|]+", str(value)) if x.strip()]

          def phase_key(value):
              s = norm(value)
              m = re.match(r"^(\\d+\\.\\d+)\\s*(?:phase|фаза)\\s*(\\d+)", s)
              return f"{m.group(1)}:{m.group(2)}" if m else s

          all_logs = []

          for g in games:
              seed = load_workbook(g["seed"], read_only=True, data_only=True)
              sws = seed.active
              sh = headers(sws)
              id_col = find_col(sh, ["id", "ид", "идентификатор"])
              name_col = find_col(sh, ["имя", "имя персонажа", "название", "name", "character name"])
              if not id_col or not name_col:
                  raise RuntimeError(f'No ID/name columns in {g["seed"]}')

              by_name = {}
              for row in sws.iter_rows(min_row=2, values_only=True):
                  cid = str(row[id_col-1] or "").strip()
                  name = str(row[name_col-1] or "").strip()
                  if cid and name:
                      by_name[norm(name)] = cid

              def resolve(names):
                  result = []
                  missing = []
                  for name in names:
                      key = norm(name)
                      cid = by_name.get(key)
                      if not cid:
                          matches = [v for k, v in by_name.items() if k.split("(")[0].strip() == key]
                          cid = matches[0] if len(matches) == 1 else None
                      if not cid:
                          missing.append(name)
                      else:
                          result.append(cid)
                  if missing:
                      similar = [k for k in by_name if any(norm(x) in k or k in norm(x) for x in missing)]
                      print(f'\nMISSING in {g["seed"]}: {missing}')
                      print('SIMILAR:', similar[:50])
                      print('ALL CHARACTERS:')
                      for k, v in by_name.items():
                          print(f'{v}\\t{k}')
                      raise RuntimeError(f'{g["banner"]}: unresolved characters {missing}')
                  return result

              five_ids = resolve(g["five"])
              four_ids = resolve(g["four"])

              path = Path(g["banner"])
              if path.exists():
                  wb = load_workbook(path)
                  ws = wb.active
              else:
                  wb = load_workbook(g["seed"])
                  ws = wb.active
                  ws.delete_rows(1, ws.max_row)
                  ws.append(["Версия и фаза", "Дата начала", "Дата окончания", "Персонажи в составе баннера", "4* в баннере"])

              h = headers(ws)
              phase_col = find_col(h, ["версия и фаза", "version and phase", "phase", "версия", "version"])
              start_col = find_col(h, ["дата начала", "start date", "start_date", "начало", "start"])
              end_col = find_col(h, ["дата окончания", "end date", "end_date", "конец", "end"])
              chars_col = find_col(h, ["персонажи в составе баннера", "персонажи", "characters", "character", "featured characters"])
              four_col = find_col(h, ["4* в баннере", "4★ в баннере", "4*", "4 star", "four star", "four_star"])
              if not all([phase_col, start_col, end_col, chars_col, four_col]):
                  raise RuntimeError(f'Unexpected banner columns in {g["banner"]}: {[c.value for c in ws[1]]}')

              target = phase_key(g["phase"])
              target_row = None
              for r in range(2, ws.max_row + 1):
                  if phase_key(ws.cell(r, phase_col).value) == target:
                      target_row = r
                      break
              if target_row is None:
                  target_row = ws.max_row + 1

              ws.cell(target_row, phase_col).value = g["phase"]
              ws.cell(target_row, start_col).value = g["start"]
              ws.cell(target_row, end_col).value = g["end"]
              ws.cell(target_row, chars_col).value = ", ".join(five_ids)
              ws.cell(target_row, four_col).value = ", ".join(four_ids)

              wb.save(path)
              all_logs.append(f'{g["banner"]}: {g["phase"]} => 5★ {five_ids}; 4★ {four_ids}')

          print("\n".join(all_logs))
          PY

      - name: Commit updated confirmed tables
        run: |
          git config user.name "G-Codus Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banners/*_confirmed.xlsx
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update current confirmed banners"
            git push
          fi
