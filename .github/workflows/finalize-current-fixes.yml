name: Finalize current G-Codus fixes

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repository character source
        run: python3 scripts/migrate_character_repository.py
      - name: Commit generated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/gcodus/MainActivity.kt app/src/main/java/com/example/gcodus/CharacterDatabase.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Use repository character tables and ID portraits"
            git push
          fi
