name: Finalize current G-Codus fixes

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install library dependencies
        run: pip install openpyxl pillow
      - name: Repair library Excel files
        run: python3 scripts/ensure_library_xlsx.py
      - name: Generate repository character data
        run: python3 scripts/generate_character_data.py
      - name: Sync ID portraits
        run: python3 scripts/sync_library_portraits.py
      - name: Apply repository character source
        run: python3 scripts/migrate_character_repository.py
      - name: Commit generated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library images app/src/main/java/com/example/gcodus/MainActivity.kt app/src/main/java/com/example/gcodus/CharacterDatabase.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Use repository character library and ID portraits"
            git push
          fi
