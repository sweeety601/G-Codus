name: Apply explicit bundled portrait mapping

on:
  push:
    paths:
      - '.github/workflows/fix-explicit-portrait-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch portrait resolver
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/example/gcodus/MainActivity.kt')
          s = p.read_text()
          start = s.index('    private fun loadPortrait(')
          end = s.index('    private fun startCountdownTicker', start)
          fn = '''    private fun loadPortrait(image: ImageView, character: String, gameId: String) {
        val key = gameId.trim().lowercase() + ":" + character.trim().lowercase()
        val localName = when (key) {
            "wuwa:hsin" -> "banner_wuthering_waves_hsin"
            "wuwa:chisa" -> "banner_wuthering_waves_chisa"
            "wuwa:iuno" -> "banner_wuthering_waves_iuno"
            "wuwa:suoming" -> "banner_wuthering_waves_suoming"
            "wuwa:lucilla" -> "banner_wuthering_waves_lucilla"
            "wuwa:lynae" -> "banner_wuthering_waves_lynae"
            "zzz:roxy" -> "banner_zenless_zone_zero_roxy"
            "zzz:promeia" -> "banner_zenless_zone_zero_promeia"
            else -> ""
        }
        val localId = if (localName.isNotEmpty()) resources.getIdentifier(localName, "drawable", packageName) else 0
        if (localId != 0) image.setImageResource(localId) else image.setImageDrawable(null)
    }

'''
          p.write_text(s[:start] + fn + s[end:])
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/gcodus/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Use explicit bundled portrait mapping'
          git push
