name: Generate character data and portraits

on:
  push:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: character-library-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Excel parser
        run: pip install openpyxl

      - name: Normalize Excel, assign IDs and generate JSON
        run: python scripts/generate_character_data.py

      - name: Copy portraits to images/<ID>.webp
        run: python scripts/sync_library_portraits.py

      - name: Validate generated character data and portraits
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('library/generated/characters.json').read_text(encoding='utf-8'))
          errors = []
          seen = set()
          for game in data['games']:
              for c in game['characters']:
                  cid = c['id']
                  if cid in seen:
                      errors.append(f'duplicate ID: {cid}')
                  seen.add(cid)
          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)
          missing = []
          for game in data['games']:
              for c in game['characters']:
                  if not Path('images', f'{c["id"]}.webp').exists():
                      missing.append(f'{c["id"]} | {c["name"]}')
          print(f'Validated {len(seen)} character IDs.')
          if missing:
              print('WARNING: missing portraits (data update is still allowed):')
              print('\n'.join(missing))
          PY

      - name: Commit generated library and portraits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add library/generated/characters.json library/generated/portrait_sync_report.json library/seed/*.xlsx images/*.webp
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Sync character library and ID portraits'
            git push
          fi
