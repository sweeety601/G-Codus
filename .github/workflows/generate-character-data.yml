name: Generate character data

on:
  push:
    paths:
      - 'data/characters/*.xlsx'
      - 'images/*.webp'
      - 'scripts/generate_character_data.py'
      - '.github/workflows/generate-character-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Excel parser
        run: pip install openpyxl

      - name: Generate JSON, assign IDs and validate portraits
        run: |
          python scripts/generate_character_data.py
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/generated/characters.json').read_text(encoding='utf-8'))
          missing = []
          seen = set()
          for game in data['games']:
              for c in game['characters']:
                  cid = c['id']
                  if cid in seen:
                      missing.append(f'duplicate ID: {cid}')
                  seen.add(cid)
                  if not Path('images', f'{cid}.webp').exists():
                      missing.append(f'missing portrait: images/{cid}.webp')
          if missing:
              print('\n'.join(missing))
              raise SystemExit(1)
          PY

      - name: Commit generated data and assigned IDs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/characters.json data/characters/*.xlsx
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Sync character data from Excel'
            git push
          fi
