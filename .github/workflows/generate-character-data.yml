name: Generate character data

on:
  push:
    paths:
      - 'data/characters/*.xlsx'
      - 'scripts/generate_character_data.py'
      - '.github/workflows/generate-character-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Excel parser
        run: pip install openpyxl

      - name: Generate JSON and assign IDs
        run: python scripts/generate_character_data.py

      - name: Commit generated data and assigned IDs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/characters.json data/characters/*.xlsx
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Sync character data from Excel'
            git push
          fi
