name: Bundle existing Genshin portraits

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'assets/genshin/portraits/**'
      - 'data/genshin_portrait_manifest.json'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle existing portraits and generate explicit mapping
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          # IMPORTANT: never download portraits here. Only use files already in the repo.
          src = Path('assets/genshin/portraits')
          dst = Path('app/src/main/assets/genshin/portraits')
          dst.mkdir(parents=True, exist_ok=True)
          for p in src.glob('*.png'):
              target = dst / p.name
              target.write_bytes(p.read_bytes())

          manifest = json.loads(Path('data/genshin_portrait_manifest.json').read_text())
          entries = {
              str(x['name']).strip().lower(): str(x['local_path']).replace('assets/genshin/portraits/', '')
              for x in manifest.get('characters', [])
              if x.get('status') == 'downloaded' and Path(str(x.get('local_path',''))).exists()
          }

          p = Path('app/src/main/java/com/example/gcodus/MainActivity.kt')
          s = p.read_text()
          start = s.index('    private fun loadPortrait(')
          end = s.index('    private fun startCountdownTicker', start)

          cases = '\n'.join(
              f'            {json.dumps("genshin:" + name)} -> {json.dumps(file)}'
              for name, file in sorted(entries.items())
          )
          fn = '''    private fun loadPortrait(image: ImageView, character: String, gameId: String) {
        // Every portrait is bundled in the APK. There is no runtime image download.
        val key = gameId.trim().lowercase() + ":" + character.trim().lowercase()
        val localPath = when (key) {
%s
            "wuwa:hsin" -> "banner_wuthering_waves_hsin"
            "wuwa:chisa" -> "banner_wuthering_waves_chisa"
            "wuwa:iuno" -> "banner_wuthering_waves_iuno"
            "wuwa:suoming" -> "banner_wuthering_waves_suoming"
            "wuwa:lucilla" -> "banner_wuthering_waves_lucilla"
            "wuwa:lynae" -> "banner_wuthering_waves_lynae"
            "zzz:roxy" -> "banner_zenless_zone_zero_roxy"
            "zzz:promeia" -> "banner_zenless_zone_zero_promeia"
            else -> ""
        }
        if (localPath.isEmpty()) {
            image.setImageDrawable(null)
            return
        }
        val assetPath = if (key.startsWith("genshin:")) {
            "genshin/portraits/$localPath"
        } else {
            ""
        }
        if (assetPath.isNotEmpty()) {
            try {
                assets.open(assetPath).use { input ->
                    android.graphics.BitmapFactory.decodeStream(input)?.let {
                        image.setImageBitmap(it)
                        return
                    }
                }
            } catch (_: Exception) { }
        } else {
            val id = resources.getIdentifier(localPath, "drawable", packageName)
            if (id != 0) {
                image.setImageResource(id)
                return
            }
        }
        image.setImageDrawable(null)
    }

''' % cases
          p.write_text(s[:start] + fn + s[end:])
          PY
      - name: Commit bundled portraits and explicit mapping
        run: |
          git config user.name 'G-Codus Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/genshin/portraits app/src/main/java/com/example/gcodus/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Use existing portraits with explicit character mapping'
            git push
          fi
