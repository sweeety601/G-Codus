name: Bundle existing Genshin portraits

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'assets/genshin/portraits/**'
      - 'data/genshin_portrait_manifest.json'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app to use existing bundled portraits only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/gcodus/MainActivity.kt')
          s = p.read_text()
          start = s.index('    private fun loadPortrait(')
          end = s.index('    private fun startCountdownTicker', start)
          fn = '''    private fun loadPortrait(image: ImageView, character: String, gameId: String) {
        // Use only portrait files already bundled in the repository/APK. Never download images.
        if (gameId.equals("genshin", ignoreCase = true)) {
            val slug = character.trim().lowercase()
                .replace("’", "")
                .replace("'", "")
                .replace("&", "and")
                .replace(Regex("[^a-z0-9]+"), "-")
                .trim('-')
            try {
                assets.open("genshin/portraits/$slug.png").use { input ->
                    val bitmap = android.graphics.BitmapFactory.decodeStream(input)
                    if (bitmap != null) {
                        image.setImageBitmap(bitmap)
                        return
                    }
                }
            } catch (_: Exception) { }
            image.setImageDrawable(null)
            return
        }

        val key = gameId.trim().lowercase() + ":" + character.trim().lowercase()
        val localName = when (key) {
            "wuwa:hsin" -> "banner_wuthering_waves_hsin"
            "wuwa:chisa" -> "banner_wuthering_waves_chisa"
            "wuwa:iuno" -> "banner_wuthering_waves_iuno"
            "wuwa:suoming" -> "banner_wuthering_waves_suoming"
            "wuwa:lucilla" -> "banner_wuthering_waves_lucilla"
            "wuwa:lynae" -> "banner_wuthering_waves_lynae"
            "zzz:roxy" -> "banner_zenless_zone_zero_roxy"
            "zzz:promeia" -> "banner_zenless_zone_zero_promeia"
            else -> ""
        }
        val localId = if (localName.isNotEmpty()) resources.getIdentifier(localName, "drawable", packageName) else 0
        if (localId != 0) image.setImageResource(localId) else image.setImageDrawable(null)
    }

'''
          p.write_text(s[:start] + fn + s[end:])
          PY
      - name: Commit app mapping only
        run: |
          git config user.name 'G-Codus Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/gcodus/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No app changes.'
          else
            git commit -m 'Use existing bundled portraits only'
            git push
          fi
