name: Sync Genshin portraits

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Download portraits
        run: python scripts/download_genshin_portraits.py
      - name: Commit portraits
        run: |
          git config user.name 'G-Codus Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/genshin/portraits data/genshin_portrait_manifest.json
          if git diff --cached --quiet; then
            echo 'No portrait changes.'
          else
            git commit -m 'Add Genshin Impact character portraits'
            git push
          fi
