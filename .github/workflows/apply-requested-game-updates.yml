name: Apply requested game updates

on:
  push:
    paths:
      - ".github/workflows/apply-requested-game-updates.yml"
      - "scripts/apply_requested_game_updates.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply requested changes
        run: python3 scripts/apply_requested_game_updates.py
      - name: Commit requested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/gcodus/MainActivity.kt app/src/main/java/com/example/gcodus/CharacterDatabase.kt app/src/main/java/com/example/gcodus/PromoCodeSource.kt scripts/sync_banners.py scripts/sync_game_icons.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to apply."
          else
            git commit -m "Fix Endfield rarities, HSR codes, scrolling games and leak sources"
            git push
          fi
