name: Sync character Excel tables

on:
  push:
    branches: [main]
    paths:
      - 'data/characters/**'
      - 'images/*.webp'
      - 'scripts/build_character_feed.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Excel reader
        run: python -m pip install openpyxl

      - name: Build character feed and assign missing IDs
        run: python scripts/build_character_feed.py

      - name: Commit generated data and assigned IDs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/characters data/characters.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Sync character tables and IDs'
            git push
          fi
