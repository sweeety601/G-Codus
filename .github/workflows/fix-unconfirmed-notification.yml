name: Fix duplicate unconfirmed character notifications

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-unconfirmed-notification.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch notification logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/gcodus/NotificationSyncWorker.kt')
          s = p.read_text()
          old = '''        // Separate date notification: fires again only when the actual start
        // date changes, so a later metadata correction is not silently missed.
        if (start != null) {
            val dateKey = "next_date_${gameId}_${identity}"
            if (prefs.getString(dateKey, null) != start) {
                showNotification(
                    stableId("next_date_${gameId}_${identity}_${start}"),
                    gameName(gameId),
                    "$name станет доступен для призыва ${formatDate(start)}."
                )
                prefs.edit().putString(dateKey, start).apply()
            }
        }
'''
          new = '''        // A probable/unconfirmed notification already contains the expected
        // date when one is available. Do NOT send a second "will be available"
        // date notification for the same unconfirmed phase. A separate date
        // notification is reserved for confirmed data only.
        if (start != null && !unconfirmed) {
            val dateKey = "next_date_${gameId}_${identity}"
            if (prefs.getString(dateKey, null) != start) {
                showNotification(
                    stableId("next_date_${gameId}_${identity}_${start}"),
                    gameName(gameId),
                    "$name станет доступен для призыва ${formatDate(start)}."
                )
                prefs.edit().putString(dateKey, start).apply()
            }
        }
'''
          if old not in s:
              raise SystemExit('Target notification block not found; aborting without changes.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Remove temporary patch workflow
        run: rm .github/workflows/fix-unconfirmed-notification.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/gcodus/NotificationSyncWorker.kt .github/workflows/fix-unconfirmed-notification.yml
          git commit -m "Fix duplicate unconfirmed character notifications"
          git push