name: Sync banner schedules

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync_banners.py"
      - ".github/workflows/sync-banners.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: g-codus-banner-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install banner parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Sync banner sources
        run: python3 scripts/sync_banners.py
      - name: Commit feed
        run: |
          git config user.name "G-Codus Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/banner_feed.json
          git diff --cached --quiet && exit 0
          git commit -m "Sync live gacha banner schedule"
          git pull --rebase origin main
          git push origin HEAD:main
