name: Sync banner schedules

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync banner sources
        run: python3 scripts/sync_banners.py
      - name: Commit feed
        run: |
          git config user.name "G-Codus Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/banner_feed.json
          git diff --cached --quiet || git commit -m "Sync live gacha banner schedule"
          git push
