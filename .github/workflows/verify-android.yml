name: Verify Android build
# Verification includes bundled game icons, portraits, and supplied HSR logo.

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "scripts/run_requested_game_updates.py"
      - "scripts/apply_current_portrait_fixes.py"
      - "scripts/sync_game_icons.py"
      - "data/gacha_character_manifest.json"
      - ".github/workflows/verify-android.yml"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply current portrait, logo and matching fixes
        run: python3 scripts/apply_current_portrait_fixes.py

      - name: Apply requested game fixes
        run: python3 scripts/run_requested_game_updates.py

      - name: Fix horizontal LayoutParams
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/example/gcodus/MainActivity.kt')
          s=p.read_text()
          s=s.replace('icons.addView(iconRow, HorizontalScrollView.LayoutParams(-2, dp(100)))','icons.addView(iconRow, android.widget.FrameLayout.LayoutParams(-2, dp(100)))')
          p.write_text(s)
          PY

      - name: Commit generated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/gcodus/MainActivity.kt app/src/main/java/com/example/gcodus/CharacterDatabase.kt app/src/main/java/com/example/gcodus/PromoCodeSource.kt scripts/sync_banners.py scripts/sync_game_icons.py scripts/apply_current_portrait_fixes.py data/gacha_character_manifest.json app/src/main/res/drawable-nodpi/game_starrail.png
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated fixes to commit."
          else
            git commit -m "Finalize portrait logo and matching fixes"
            git push
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.0"
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: G-Codus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
