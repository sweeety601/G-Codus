name: Verify Android build

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "admin/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/verify-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Assemble debug APKs
        run: ./gradlew :app:assembleDebug :admin:assembleDebug --stacktrace
      - name: Verify main APK contains no bundled character data
        run: |
          set -e
          unzip -l app/build/outputs/apk/debug/app-debug.apk > /tmp/gcodus-apk-files.txt
          if grep -E 'assets/.*\\.webp|assets/banner_feed\\.json|drawable.*/banner_.*\\.webp' /tmp/gcodus-apk-files.txt; then
            echo 'ERROR: bundled character data detected in main APK'
            exit 1
          fi
          echo 'Main APK contains no bundled character assets or local banner feed.'

      - name: Upload main app
        uses: actions/upload-artifact@v4
        with:
          name: G-Codus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload admin app
        uses: actions/upload-artifact@v4
        with:
          name: G-Codus-Admin-debug-apk
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
          retention-days: 7
